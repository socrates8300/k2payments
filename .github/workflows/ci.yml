name: CI

on:
  push:
  pull_request:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Default features (the production deployment config).
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # All features so channel-tcp/nats/kafka/amqp/file and store-rocksdb
      # code paths inside app.rs/engine.rs are linted too.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      # Broken rustdoc is a regression for an AGPL-distributed library.
      - run: cargo doc --workspace --no-deps --document-private-items

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --version 0.19.0 --locked && cargo deny check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mx20022_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mx20022_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mx20022_ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --locked: fail if Cargo.lock is out of sync with manifests (guards
      #   against silently re-resolving vulnerable pinned deps in CI).
      # --all-targets: also build/run benches, examples, and integration tests.
      - run: cargo test --locked --all-targets --workspace

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mx20022_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mx20022_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mx20022_ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.6.16 --locked
      - name: Coverage Gate
        # Floor set just below the current measured coverage (63.85% lines)
        # so the gate catches regressions without being flaky. Target: 75%.
        # Raise incrementally as the test suite grows.
        run: cargo llvm-cov --workspace --summary-only --fail-under-lines 63
